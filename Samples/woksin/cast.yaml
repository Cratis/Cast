eventModel:
  name: Varde · Chores
  repo: https://github.com/woksin/Varde
  sourceRoot: Source/Varde
  columns: 7
  lanes:
    - id: ui
      label: Screens
    - id: middle
      label: Commands · Read models
    - id: chore
      label: Chore stream
    - id: member
      label: Member stream
  cards:
    - id: define-ui
      kind: ui
      name: DefineChoreDialog
      lane: ui
      col: 0
      source: Chores/Catalog/DefineChoreDialog.tsx
      note: Where a parent writes the chore.
    - id: define
      kind: command
      name: Define
      lane: middle
      col: 0
      source: Chores/Define/Define.cs
      note: Parents and administrators only. A plikt cannot pay, a reward is capped at 500, and it must earn experience.
    - id: defined
      kind: event
      name: ChoreDefined
      lane: chore
      col: 0
      source: Chores/Define/Define.cs
      note: Title, kind, unlock level, reward, experience, schedule, who it is for, and whether it is shared work.
    - id: definition
      kind: view
      name: ChoreDefinition
      lane: middle
      col: 1
      source: Chores/Catalog/Catalog.cs
      note: Projected straight off ChoreDefined; later amendments set fields from ChoreAmended.
    - id: board
      kind: view
      name: BoardEntry
      lane: middle
      col: 2
      source: Chores/Board/Board.cs
      note: "One card on a member’s board: what it pays, whether it is done, and how many levels until it unlocks."
    - id: board-ui
      kind: ui
      name: BoardPage
      lane: ui
      col: 2
      source: Chores/Board/BoardPage.tsx
      note: The kitchen-wall board a member taps.
    - id: complete
      kind: command
      name: Complete
      lane: middle
      col: 3
      source: Chores/Complete/Complete.cs
      note: Appends to the member’s stream. Refused if it is already done today, or if shared work was done by someone else.
    - id: completed
      kind: event
      name: ChoreCompleted
      lane: member
      col: 3
      source: Chores/Complete/Complete.cs
      note: Carries the experience and reward awarded and the level at completion, so repricing a chore later never rewrites what was earned.
    - id: standing
      kind: view
      name: MemberStanding
      lane: middle
      col: 4
      source: Progression/Standing/Standing.cs
      note: Adds ExperienceAwarded and RewardAwarded from every ChoreCompleted.
    - id: log
      kind: view
      name: MemberCompletionLog
      lane: middle
      col: 5
      source: Progression/Standing/CompletionLog.cs
      note: The history of what a member did. The board reads it too, which is how a card turns done.
    - id: ledger
      kind: view
      name: MemberLedger
      lane: middle
      col: 6
      source: Rewards/Ledger/Ledger.cs
      note: Composed at query time from the completion, claim and settlement logs. No balance is stored.
    - id: ledger-ui
      kind: ui
      name: LedgerSheet
      lane: ui
      col: 6
      source: Rewards/Ledger/LedgerSheet.tsx
      note: Shows a member every movement, newest first.
  edges:
    - - define-ui
      - define
    - - define
      - defined
    - - defined
      - definition
    - - definition
      - board
    - - board
      - board-ui
    - - board-ui
      - complete
    - - complete
      - completed
    - - completed
      - standing
    - - completed
      - log
    - - log
      - ledger
    - - ledger
      - ledger-ui
  steps:
    - title: A parent defines a chore
      text: The dialog sends Define. The command validates the rules of the house and appends ChoreDefined to a new chore stream.
      cards:
        - define-ui
        - define
        - defined
    - title: It lands on a board
      text: ChoreDefinition is projected from the event, and each member’s BoardEntry is built from it for BoardPage.
      cards:
        - defined
        - definition
        - board
        - board-ui
    - title: A member completes it
      text: Tapping the card sends Complete, which appends ChoreCompleted to the member’s own stream, with what it was worth at that moment.
      cards:
        - board-ui
        - complete
        - completed
    - title: Experience and reward are projected
      text: MemberStanding adds up experience and reward, MemberCompletionLog keeps the history, and MemberLedger folds both into what LedgerSheet shows.
      cards:
        - completed
        - standing
        - log
        - ledger
        - ledger-ui
  intro: "Before code, I draw how information flows: screens send commands, commands append events, events feed read models, read models feed screens. This is a real slice from [Varde](https://github.com/woksin/Varde), my family app, and every name on it is a type in its source."
  summary: "4 steps, 12 cards, two streams: chores are keyed by chore, completions by member."
agentic:
  pitch: "Using coding agents is the easy part. I build what makes them reliable collaborators: the rules, routing, guards, queues and reviews around them, and the tools that measure what they actually do."
  workflow:
    - step: Plan
      event: TaskPlanned
      who: Orchestrator
      text: Scopes the change and writes a brief with owned files, the exact gate command and a done condition.
    - step: Implement
      event: ChangeImplemented
      who: Pinned subagent
      text: A subagent type pinned to a model and thinking level does the work inside the brief.
    - step: Review
      event: ChangeReviewed
      who: Other provider
      text: Adversarial review by a model from another provider. Only confirmed blocking findings send it back.
      loop: blocker → Implement
    - step: Gate
      event: GatesPassed
      who: Local CI mirror
      text: The same build, lint and tests as CI, run locally through a priority build queue before anything is pushed.
    - step: Ship
      event: PullRequestMerged
      who: Orchestrator
      text: Push once, wait for CI without polling, merge, and close the issue.
  items:
    - name: pi-setup
      url: https://github.com/woksin/pi-setup
      kind: Agent configuration
      text: "My complete, published agent setup: 17 custom subagent types each pinned to a model and thinking level, model-routing profiles, and workflows including a cross-provider adversarial code review that gates only on confirmed blocking findings."
      list:
        - Guards
        - Wait-guard that blocks CI polling
        - Issue-work leases across sessions
        - Provider fallback
        - Phase-priority build queue
        - Cache retention
        - ai-work lifecycle
        - Cratis CLI guard
      listLabel: 8 extensions
    - name: pi-jobs
      url: https://github.com/woksin/pi-jobs
      kind: npm · @woksin/pi-jobs
      text: Background jobs and watches that wake the agent when they finish, at zero token cost.
    - name: pi-recover
      url: https://github.com/woksin/pi-recover
      kind: npm · @woksin/pi-recover
      text: Pick up subagents, jobs and workflows from a session that stopped abruptly.
    - name: workstats
      url: https://github.com/woksin/workstats
      kind: Measurement
      text: "Measuring rather than claiming AI productivity: human hours against agent wall-clock, parallel-agent concurrency, tokens, and agent-authored against co-authored commits."
    - name: Cratis AI
      url: https://github.com/Cratis/AI
      kind: Agent corpus
      text: One canonical set of Cratis rules, skills and agents with adapters for Claude Code, Codex, Copilot, Cursor, OpenCode and Pi.
