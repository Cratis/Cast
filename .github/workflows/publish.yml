name: Publish

# Never cancel a release in flight: one push to main is one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
  # Releasing on push rather than on the pull_request closed event lets merged fork contributions release:
  # a push to main runs with a full-permission token, and the release action finds the merged pull request
  # and its label from the commit.
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "Registry/members.yaml"
      - "package.json"
      - "yarn.lock"

permissions:
  issues: write
  contents: write
  deployments: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-npm-packages:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: 'https://registry.npmjs.org'
      - name: Configure npm for OIDC-based publishing
        run: |
          # setup-node writes a placeholder _authToken into .npmrc and exports NODE_AUTH_TOKEN
          # with the same placeholder. npm uses this token as-is → 404. Remove it so npm falls
          # back to OIDC.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: npm install -g npm@11
      - run: yarn install --immutable
      # Only the published packages are built here: @cratis/cast (schema and bundled registry) and
      # @cratis/create-cast (the bin). The directory and the sample are private and never published.
      - name: Publish NPM packages
        run: |
          yarn workspace @cratis/cast build
          yarn workspace @cratis/create-cast build
          yarn verify-packages
          yarn publish-version ${{ needs.release.outputs.version }}
      - name: Git reset (package.json files changed)
        run: git reset --hard

  verify-published:
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    steps:
      - run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
