name: Directory Pages

# Builds cast.cratis.io from the registry and public GitHub data, and deploys it to GitHub Pages.
on:
  push:
    branches:
      - main
    paths:
      - "Directory/**"
      - "Registry/**"
      - "Source/Cast/**"
  # Every six hours, so new contributors and fresh numbers show up without a push.
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

# Least privilege by default; only the deploy job can write to Pages.
permissions:
  contents: read

concurrency:
  group: directory-pages
  cancel-in-progress: false

jobs:
  build:
    # Off until cast.cratis.io resolves to GitHub Pages and is set as the Pages domain
    # (https://github.com/Cratis/Cast/issues/8). Turn on with the repository variable CAST_DIRECTORY_ENABLED=true.
    if: vars.CAST_DIRECTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 23.x
      - name: Yarn install
        run: yarn install --immutable
      - name: Build the engine (schema and bundled registry)
        run: yarn workspace @cratis/cast build
      - name: Restore the last good member profiles and GitHub data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Directory/.cast/cache
          key: directory-cache-${{ github.run_id }}
          restore-keys: |
            directory-cache-
      - name: Build the directory
        run: yarn workspace @cratis/cast-directory build
        env:
          # Read-only: public profiles, contributor discovery and merged pull request counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./Directory/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
