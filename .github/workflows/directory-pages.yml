name: Directory Pages

# Builds cast.cratis.io from the registry and public GitHub data, and deploys it to GitHub Pages.
on:
  push:
    branches:
      - main
    paths:
      - "Directory/**"
      - "Registry/**"
      - "Source/Cast/**"
  # Every six hours, so new contributors and fresh numbers show up without a push.
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

# Least privilege by default; only the deploy job can write to Pages.
permissions:
  contents: read

concurrency:
  group: directory-pages
  cancel-in-progress: false

jobs:
  build:
    # Off until cast.cratis.io resolves to GitHub Pages and is set as the Pages domain
    # (https://github.com/Cratis/Cast/issues/8). Turn on with the repository variable CAST_DIRECTORY_ENABLED=true.
    if: vars.CAST_DIRECTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 23.x
      - name: Yarn install
        run: yarn install --immutable
      - name: Build the engine (schema and bundled registry)
        run: yarn workspace @cratis/cast build
      - name: Restore the last good member profiles and GitHub data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Directory/.cast/cache
          key: directory-cache-${{ github.run_id }}
          restore-keys: |
            directory-cache-
      - name: Build the directory
        run: yarn workspace @cratis/cast-directory build
        env:
          # Read-only: public profiles, contributor discovery and merged pull request counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./Directory/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
