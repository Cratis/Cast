name: JavaScript Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Registry/**"
      - "Directory/**"
      - "Samples/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "eslint.config.mjs"
      - "tsconfig.base.json"
      - "vitest.*.ts"
      - "run-task-on-workspaces.js"
      - "verify-package-contents.js"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock', '**/package.json') }}

      - name: Yarn install
        run: yarn install --immutable

      # Clean, lint, build and test every workspace: the engine, the scaffolder, the registry,
      # the directory and the sample site. Builds read public GitHub data with the read-only token.
      - name: Build JS/TS
        run: yarn ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packed packages hold no specifications
        run: yarn verify-packages

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x

      - name: Yarn install
        run: yarn install --immutable

      # Valid YAML, known fields, core or partner only, unique handles. Logins are checked by reviewers.
      - name: Validate Registry/members.yaml
        run: yarn workspace @cratis/cast-registry test
